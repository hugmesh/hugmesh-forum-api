# Snapdragon Forum API — service container definitions.
#
# Wires the auth chain (JWKS provider -> JWT verifier -> authenticator), the
# config provider, the data services, and the three controllers, injecting phpBB
# core services (@dbal.conn, @user, @auth, @config, @content.visibility) and the
# %core.*% parameters.

services:

    # ── configuration ────────────────────────────────────────────────
    snapdragon.forumapi.config_provider:
        class: snapdragon\forumapi\config_provider
        arguments:
            - '@config'

    # ── auth chain ───────────────────────────────────────────────────
    # The factory reads the env/config-resolved JWKS URI / issuer / audience at
    # request time (no ExpressionLanguage dependency in the container).
    snapdragon.forumapi.auth.factory:
        class: snapdragon\forumapi\auth\auth_factory
        arguments:
            - '@snapdragon.forumapi.config_provider'
            - '@cache.driver'

    snapdragon.forumapi.auth.authenticator:
        class: snapdragon\forumapi\auth\authenticator
        factory: ['@snapdragon.forumapi.auth.factory', 'authenticator']

    # ── data services ────────────────────────────────────────────────
    snapdragon.forumapi.service.forum_repository:
        class: snapdragon\forumapi\service\forum_repository
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%'

    snapdragon.forumapi.service.user_mapper:
        class: snapdragon\forumapi\service\user_mapper
        arguments:
            - '@dbal.conn'
            - '@config'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'

    snapdragon.forumapi.service.posting_service:
        class: snapdragon\forumapi\service\posting_service
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@auth'
            - '@content.visibility'
            - '@config'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'

    snapdragon.forumapi.service.admin_service:
        class: snapdragon\forumapi\service\admin_service
        arguments:
            - '@dbal.conn'
            - '@snapdragon.forumapi.service.user_mapper'
            - '@snapdragon.forumapi.service.forum_repository'
            - '@config'
            - '@service_container'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'

    # ── controllers ──────────────────────────────────────────────────
    # @symfony_request is phpBB's own Symfony Request (built from the phpBB request, which
    # retains the real GET/POST/SERVER/headers). It MUST be injected instead of calling
    # Request::createFromGlobals(), because phpBB deactivates the PHP superglobals and
    # createFromGlobals() then throws a TypeError on every request.
    snapdragon.forumapi.controller.read:
        class: snapdragon\forumapi\controller\read_controller
        arguments:
            - '@snapdragon.forumapi.auth.authenticator'
            - '@snapdragon.forumapi.service.forum_repository'
            - '@symfony_request'

    snapdragon.forumapi.controller.write:
        class: snapdragon\forumapi\controller\write_controller
        arguments:
            - '@snapdragon.forumapi.auth.authenticator'
            - '@snapdragon.forumapi.service.forum_repository'
            - '@snapdragon.forumapi.service.posting_service'
            - '@snapdragon.forumapi.service.user_mapper'
            - '@snapdragon.forumapi.config_provider'
            - '@symfony_request'

    snapdragon.forumapi.controller.admin:
        class: snapdragon\forumapi\controller\admin_controller
        arguments:
            - '@snapdragon.forumapi.auth.authenticator'
            - '@snapdragon.forumapi.service.user_mapper'
            - '@snapdragon.forumapi.service.forum_repository'
            - '@snapdragon.forumapi.service.admin_service'
            - '@snapdragon.forumapi.service.posting_service'
            - '@symfony_request'
