# HugMesh Forum API — service container definitions.
#
# Wires the auth chain (JWKS provider -> JWT verifier -> authenticator), the
# config provider, the data services, the three controllers, and the s9e
# text-formatter event listener, injecting phpBB core services (@dbal.conn, @user,
# @auth, @config, @content.visibility) and the %core.*% parameters.

services:

    # ── configuration ────────────────────────────────────────────────
    hugmesh.forumapi.config_provider:
        class: hugmesh\forumapi\config_provider
        arguments:
            - '@config'

    # ── auth chain ───────────────────────────────────────────────────
    # The factory reads the env/config-resolved JWKS URI / issuer / audience at
    # request time (no ExpressionLanguage dependency in the container).
    hugmesh.forumapi.auth.factory:
        class: hugmesh\forumapi\auth\auth_factory
        arguments:
            - '@hugmesh.forumapi.config_provider'
            - '@cache.driver'

    hugmesh.forumapi.auth.authenticator:
        class: hugmesh\forumapi\auth\authenticator
        factory: ['@hugmesh.forumapi.auth.factory', 'authenticator']

    # ── data services ────────────────────────────────────────────────
    hugmesh.forumapi.service.forum_repository:
        class: hugmesh\forumapi\service\forum_repository
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%'

    hugmesh.forumapi.service.user_mapper:
        class: hugmesh\forumapi\service\user_mapper
        arguments:
            - '@dbal.conn'
            - '@config'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'

    hugmesh.forumapi.service.posting_service:
        class: hugmesh\forumapi\service\posting_service
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@auth'
            - '@content.visibility'
            - '@config'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'

    hugmesh.forumapi.service.admin_service:
        class: hugmesh\forumapi\service\admin_service
        arguments:
            - '@dbal.conn'
            - '@hugmesh.forumapi.service.user_mapper'
            - '@hugmesh.forumapi.service.forum_repository'
            - '@config'
            - '@service_container'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'

    # ── controllers ──────────────────────────────────────────────────
    # @symfony_request is phpBB's own Symfony Request (built from the phpBB request, which
    # retains the real GET/POST/SERVER/headers). It MUST be injected instead of calling
    # Request::createFromGlobals(), because phpBB deactivates the PHP superglobals and
    # createFromGlobals() then throws a TypeError on every request.
    hugmesh.forumapi.controller.read:
        class: hugmesh\forumapi\controller\read_controller
        arguments:
            - '@hugmesh.forumapi.auth.authenticator'
            - '@hugmesh.forumapi.service.forum_repository'
            - '@symfony_request'

    hugmesh.forumapi.controller.write:
        class: hugmesh\forumapi\controller\write_controller
        arguments:
            - '@hugmesh.forumapi.auth.authenticator'
            - '@hugmesh.forumapi.service.forum_repository'
            - '@hugmesh.forumapi.service.posting_service'
            - '@hugmesh.forumapi.service.user_mapper'
            - '@hugmesh.forumapi.config_provider'
            - '@symfony_request'

    hugmesh.forumapi.controller.admin:
        class: hugmesh\forumapi\controller\admin_controller
        arguments:
            - '@hugmesh.forumapi.auth.authenticator'
            - '@hugmesh.forumapi.service.user_mapper'
            - '@hugmesh.forumapi.service.forum_repository'
            - '@hugmesh.forumapi.service.admin_service'
            - '@hugmesh.forumapi.service.posting_service'
            - '@symfony_request'

    # ── event listeners ─────────────────────────────────────────────
    # Registers `:snap-sticker:<slug>:` as a real s9e\TextFormatter tag (see the class doc
    # for exactly which phpBB event this hooks and why).
    hugmesh.forumapi.event.main_listener:
        class: hugmesh\forumapi\event\main_listener
        tags:
            - { name: event.listener }
