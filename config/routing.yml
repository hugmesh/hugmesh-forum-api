# Snapdragon Forum API — route definitions.
#
# All paths are under the base /api/v1/snapdragon (the prefix the forum-bff
# PhpbbApiClient / PhpbbAdminClient call). Symfony routing (phpBB 3.3 / HttpKernel).
# _controller references service.id:method (single colon).

# ── Health (UNAUTHENTICATED — k8s liveness/readiness probe) ─────────────
# The deployment probes this path with no JWT; it must answer 200 without auth.
# Safe: ClusterIP-only + NetworkPolicy-locked Service, static body, no DB/forum data.

snapdragon_forumapi_health:
    path: /api/v1/snapdragon/health
    methods: [GET]
    defaults:
        _controller: snapdragon.forumapi.controller.read:health

# ── Reads (any authenticated user) ──────────────────────────────────────

snapdragon_forumapi_categories:
    path: /api/v1/snapdragon/categories
    methods: [GET]
    defaults:
        _controller: snapdragon.forumapi.controller.read:categories

snapdragon_forumapi_topics:
    path: /api/v1/snapdragon/topics
    methods: [GET]
    defaults:
        _controller: snapdragon.forumapi.controller.read:topics

snapdragon_forumapi_topic:
    path: /api/v1/snapdragon/topics/{id}
    methods: [GET]
    defaults:
        _controller: snapdragon.forumapi.controller.read:topic
    requirements:
        id: \d+

snapdragon_forumapi_topic_replies:
    path: /api/v1/snapdragon/topics/{id}/replies
    methods: [GET]
    defaults:
        _controller: snapdragon.forumapi.controller.read:replies
    requirements:
        id: \d+

snapdragon_forumapi_post:
    path: /api/v1/snapdragon/posts/{id}
    methods: [GET]
    defaults:
        _controller: snapdragon.forumapi.controller.read:post
    requirements:
        id: \d+

snapdragon_forumapi_stats:
    path: /api/v1/snapdragon/stats
    methods: [GET]
    defaults:
        _controller: snapdragon.forumapi.controller.read:stats

# ── Writes (acts-as-user; author = JWT sub) ─────────────────────────────

snapdragon_forumapi_create_topic:
    path: /api/v1/snapdragon/topics
    methods: [POST]
    defaults:
        _controller: snapdragon.forumapi.controller.write:create_topic

snapdragon_forumapi_create_reply:
    path: /api/v1/snapdragon/topics/{id}/replies
    methods: [POST]
    defaults:
        _controller: snapdragon.forumapi.controller.write:create_reply
    requirements:
        id: \d+

snapdragon_forumapi_edit_post:
    path: /api/v1/snapdragon/posts/{id}
    methods: [PUT]
    defaults:
        _controller: snapdragon.forumapi.controller.write:edit_post
    requirements:
        id: \d+

snapdragon_forumapi_delete_post:
    path: /api/v1/snapdragon/posts/{id}
    methods: [DELETE]
    defaults:
        _controller: snapdragon.forumapi.controller.write:delete_post
    requirements:
        id: \d+

snapdragon_forumapi_moderate_topic:
    path: /api/v1/snapdragon/moderation/topics/{id}
    methods: [POST]
    defaults:
        _controller: snapdragon.forumapi.controller.write:moderate_topic
    requirements:
        id: \d+

# ── Admin / declarative (ROLE_ADMIN) ────────────────────────────────────

snapdragon_forumapi_ensure_user:
    path: /api/v1/snapdragon/users/{sub}/ensure
    methods: [POST]
    defaults:
        _controller: snapdragon.forumapi.controller.admin:ensure_user
    requirements:
        sub: '[^/]+'

