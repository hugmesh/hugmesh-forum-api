# Snapdragon Forum API — GitLab CI (this org uses GitLab CI, not GitHub Actions).
#
# Stages: lint (php -l every file) -> validate (composer) -> test (phpunit) ->
#         build (bake + push the custom phpBB image).
# No live phpBB is required for lint/validate/test; the unit suite exercises the
# JWT/JWKS auth chain only. The full contract is proven by the docker-compose live
# smoke (see README "Live smoke").

stages:
    - lint
    - validate
    - test
    - build

default:
    image: php:8.1-cli

variables:
    COMPOSER_ALLOW_SUPERUSER: "1"

.composer_setup: &composer_setup
    - apt-get update -qq && apt-get install -y -qq git unzip libzip-dev > /dev/null
    - docker-php-ext-install zip > /dev/null 2>&1 || true
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

php-lint:
    stage: lint
    script:
        - echo "Running php -l on every .php file"
        - |
            fail=0
            while IFS= read -r f; do
                if ! php -l "$f" > /dev/null; then
                    echo "SYNTAX ERROR: $f"
                    php -l "$f"
                    fail=1
                fi
            done < <(find . -path ./vendor -prune -o -name '*.php' -print)
            exit $fail

composer-validate:
    stage: validate
    script:
        - *composer_setup
        - composer validate --no-check-publish

phpunit:
    stage: test
    script:
        - *composer_setup
        - composer install --no-interaction --prefer-dist
        - vendor/bin/phpunit --colors=never

# -----------------------------------------------------------------------------
# build:image — bake the custom phpBB image (official phpBB 3.3.11 + THIS
# extension at ext/snapdragon/forumapi, baked by the Dockerfile) and push it to
# the in-cluster GitLab container registry. The forum deployment
# (snapdragon-generator specs/cluster/manifests/forum/phpbb.yaml) runs this image:
# its initContainer installs + locks down phpBB, and the image entrypoint enables
# the extension on boot. Until this job existed nothing published the image, so
# the forum could never come up — this is the load-bearing go-live step.
#
# Runs ONLY on the default branch and tags (never on MRs), so images are published
# from reviewed code. Immutable tag = release tag or commit SHA (traceability);
# the moving `dev` tag is what the dev kustomize overlay / forum manifest tracks.
# No build secret is needed — the Dockerfile pulls only public phpBB + composer and
# the extension source IS the build context (contrast the Maven services, which
# mount CI_JOB_TOKEN to resolve the private snapdragon-commons artifact).
#
# Mirrors the org pattern (snapdragon-forum-bff-api build:image): the privileged
# x86 shell runner provides the host Docker daemon; docker login uses the
# GitLab-injected CI_REGISTRY_USER / CI_REGISTRY_PASSWORD / CI_REGISTRY. The
# deployment's logical image `snapdragon-systems/phpbb:dev` is resolved to
# $CI_REGISTRY_IMAGE:dev by the generator's image mapping at render time.
# -----------------------------------------------------------------------------
build:image:
    stage: build
    needs: [phpunit]
    tags: [snapdragon-x86, privileged]
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_COMMIT_TAG'
    script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
        - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:dev" .
        - docker push "$CI_REGISTRY_IMAGE:$TAG"
        - docker push "$CI_REGISTRY_IMAGE:dev"
