# Local validation harness for the snapdragon/forum-api phpBB extension —
# CLUSTER-SHAPED: phpBB 3.3 (this extension baked in, rootless apache on 8080,
# headless install, install/ removed before serving) + Postgres 16, i.e. the same
# dbms + boot flow as the snapdragon-generator forum deployment. This is the live
# smoke the unit tests CANNOT cover (real submit_post() / content_visibility /
# user_add against a real pgsql schema).
#
# Usage (fully headless — the phpBB web installer is intentionally unreachable:
# the image's Apache lockdown denies every .php except app.php and the entrypoint
# removes install/ before serving):
#   docker compose up --build
#   # First boot: the entrypoint probes the empty Postgres and runs the headless
#   # installer with docker/install-config.compose.yml (baked into the image at
#   # /var/www/html/ext/snapdragon/forumapi/docker/; DEV-ONLY literal creds), then
#   # enables snapdragon/forumapi and serves. Re-boots detect the installed schema
#   # and never re-DDL. Then exercise:
#   #   GET  http://localhost:8080/app.php/api/v1/snapdragon/health   (200, no JWT)
#   #   GET  http://localhost:8080/app.php/api/v1/snapdragon/stats
#   #        -H "Authorization: Bearer <casdoor-jwt>" -H "X-Snapdragon-JWT: <casdoor-jwt>"
#   #   POST http://localhost:8080/app.php/api/v1/snapdragon/topics  (CreateTopic body)
#
# JWKS/issuer point at your dev Casdoor; with no live Casdoor the extension fails
# closed (401) — which itself proves the auth gate.

services:
    db:
        # Postgres — the SAME dbms the cluster deployment runs (phpbb-db). The
        # entrypoint's DDL-once schema probe is pgsql (pg_connect), so headless
        # install only works against Postgres; MySQL remains manual-install-only.
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: phpbb
            POSTGRES_USER: phpbb
            POSTGRES_PASSWORD: phpbb
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U phpbb -d phpbb"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - db_data:/var/lib/postgresql/data

    phpbb:
        build:
            context: .
            dockerfile: Dockerfile
        image: snapdragon-systems/phpbb:dev
        depends_on:
            db:
                condition: service_healthy
        environment:
            PHPBB_EXTENSION: snapdragon/forumapi
            # config.php connection params — the image entrypoint REGENERATES
            # config.php from these on EVERY boot (same mechanism as on-cluster,
            # where the init/main filesystem split makes this mandatory). Local
            # simplification: one role (phpbb) is both owner and app user.
            PHPBB_DB_DRIVER: 'phpbb\db\driver\postgres'
            PHPBB_DB_HOST: db
            PHPBB_DB_PORT: "5432"
            PHPBB_DB_NAME: phpbb
            PHPBB_DB_USER: phpbb
            PHPBB_APP_PASSWORD: phpbb
            PHPBB_TABLE_PREFIX: phpbb_
            # Path (in the image) to the DEV-ONLY headless install YAML. Set =>
            # the entrypoint runs the DDL-once guarded installer on an empty DB
            # (on-cluster this is unset — the deployment initContainer owns DDL).
            PHPBB_INSTALL_CONFIG: /var/www/html/ext/snapdragon/forumapi/docker/install-config.compose.yml
            # Point these at a dev Casdoor. With no live Casdoor the extension fails
            # closed (every request -> 401), which proves the JWT gate.
            SNAPDRAGON_JWKS_URI: "${SNAPDRAGON_JWKS_URI:-https://casdoor.dev.local/.well-known/jwks}"
            SNAPDRAGON_JWT_ISSUER: "${SNAPDRAGON_JWT_ISSUER:-https://casdoor.dev.local}"
            SNAPDRAGON_JWT_AUDIENCE: "${SNAPDRAGON_JWT_AUDIENCE:-}"
        ports:
            # Rootless image: apache binds 8080 in-container (USER 33 cannot bind 80).
            - "8080:8080"

volumes:
    db_data:
