name: Release

# Publishes the phpBB image with this extension baked in: ghcr.io/hugmesh/hugmesh-forum-api.
#
# The release channel comes from the TAG (scripts/release-channel.sh decides
# every case below and is tested by scripts/test-release-channel.sh, which the
# version job runs first):
#
#   push to main                   -> :main and :sha-<12 hex>
#   push to release/X.Y            -> :sha-<12 hex> only (the same main-style run
#                                     the release script checks before it tags)
#   push of tag vX.Y.Z-beta.N      -> :X.Y.Z-beta.N, :beta and :sha-<12 hex>,
#                                     plus a GitHub prerelease (never Latest).
#                                     The commit must be on main.
#   push of tag vX.Y.Z (stable)    -> :X.Y.Z, :X.Y, :latest and :sha-<12 hex>,
#                                     plus a GitHub release marked Latest. The
#                                     commit must be on release/X.Y. A patch on an
#                                     older line (a newer stable vA.B.C is
#                                     published) moves :X.Y but not :latest, and
#                                     its GitHub release is not marked Latest.
#   workflow_dispatch on main, a release/X.Y branch or a v* tag
#                                  -> same as the push; for a tag, an image
#                                     already published from this commit is not
#                                     pushed again but IS signed, attested and
#                                     checked again (a re-run repairs a run whose
#                                     signing failed), and a GitHub release that
#                                     already exists is left alone
#   anything else                  -> refused by the version job (this includes
#                                     release/<anything that is not X.Y>)
#
# The version comes from composer.json "version". A tag must equal "v" + that
# version. :X.Y.Z is never overwritten; the floating tags :beta, :X.Y and
# :latest move. Every tag a run pushes points at one digest, and that digest is
# signed and attested (a check after the push proves it).
#
# The version job only refuses early. "Re-run failed jobs" reuses its outputs,
# however old they are, and a newer stable can publish while a run is in its
# test job, so whether :X.Y and :latest move is decided again by the same script
# right before the push and right before gh release create. No later job reads
# the version job's answer, so a re-run cannot move a floating tag to an older
# line. A window of seconds remains between that check and the registry write
# (a registry has no compare-and-swap); if a concurrent run wins it, the digest
# check below fails that run.
#
# A GitHub release is only ever created by a run whose image job succeeded, and
# the image job only succeeds once the digest every tag resolves to is signed
# and attested: a run that skips the push (the version is already published
# from this commit) signs that published digest instead of a fresh one, so
# "Re-run failed jobs" after a Sigstore failure repairs the release rather than
# going green around it. No step in the image job continues on error and
# github-release never runs on a failed image job.
#
# Runner rule: there is NO pull_request trigger here, ever. The image job (build, push,
# sign) and notify-site run on GitHub-hosted ubuntu-latest, written literally: a published,
# signed image is never built on a self-hosted runner. For the other jobs the runs-on line
# below sends a job to the runner named by the RUNS_ON_PUBLISH variable (a JSON array, for example
# ["self-hosted","Linux","X64"]) only for main and v* tag refs and never for a PR event.
# In every other case (release/X.Y branches included), and when RUNS_ON_PUBLISH is unset,
# the job runs on hosted ubuntu-latest. Deleting RUNS_ON_PUBLISH sends every job back to
# hosted runners.
#
# hugmesh-release-channels: beta+stable
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/hugmesh/hugmesh-forum-api

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      kind: ${{ steps.resolve.outputs.kind }}
      channel: ${{ steps.resolve.outputs.channel }}
      line: ${{ steps.resolve.outputs.line }}
      sha12: ${{ steps.resolve.outputs.sha12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the release channel rules
        run: bash scripts/test-release-channel.sh

      - name: Resolve the version and what kind of run this is
        id: resolve
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys

          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          with open("composer.json", encoding="utf-8") as fh:
              version = json.load(fh).get("version", "")
          event = os.environ["GITHUB_EVENT_NAME"]

          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?", version):
              die(f"composer.json version {version!r} is not MAJOR.MINOR.PATCH[-pre] (no +build part)")
          if re.search(r"snapshot|dev", version, re.IGNORECASE):
              die(f"composer.json version {version!r} is a development version; it is never published")
          if event in ("pull_request", "pull_request_target"):
              die("this workflow never publishes from a pull request event")
          PY
          version="$(python3 -c 'import json; print(json.load(open("composer.json", encoding="utf-8"))["version"])')"
          # Channel, branch rules and image tags: scripts/release-channel.sh.
          out="$(VERSION="$version" VERSION_FILE=composer.json bash scripts/release-channel.sh)"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"
          echo "$out"

  lint-and-test:
    # The same gate as .gitlab-ci.yml (php -l -> composer validate -> phpunit), run in the
    # same php:8.1-cli image so it behaves the same on hosted and self-hosted runners
    # (the self-hosted host has no PHP, and setup-php does not support it).
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: php -l, composer validate, composer install, phpunit (php:8.1-cli)
        run: |
          # The container runs as root; the EXIT trap hands every file it wrote back to the
          # runner's user so a self-hosted runner can clean its workspace next time.
          docker run --rm -i --network host \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e COMPOSER_ALLOW_SUPERUSER=1 \
            -v "$GITHUB_WORKSPACE:/app" -w /app \
            php:8.1-cli bash -euo pipefail -s <<'GATE'
          trap 'chown -R "$HOST_UID:$HOST_GID" /app' EXIT
          apt-get update -qq
          apt-get install -y -qq git unzip libzip-dev > /dev/null
          docker-php-ext-install zip > /dev/null 2>&1 || true
          curl -sS https://getcomposer.org/installer | php -- --2 --install-dir=/usr/local/bin --filename=composer
          git config --global --add safe.directory /app

          echo "php -l on every .php file"
          fail=0
          while IFS= read -r f; do
            if ! php -l "$f" > /dev/null; then
              echo "SYNTAX ERROR: $f"
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -path ./vendor -prune -o -name '*.php' -print)
          [ "$fail" -eq 0 ]

          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist
          vendor/bin/phpunit --colors=never
          GATE

  image:
    needs: [version, lint-and-test]
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      SHA12: ${{ needs.version.outputs.sha12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the immutable :X.Y.Z (or :X.Y.Z-beta.N) is checked here. The
      # floating tags :beta, :X.Y and :latest are meant to move to a newer
      # release, so they are not. A re-run on the same commit (the published
      # :X.Y.Z is the very manifest this commit's :sha-<12> points at) skips the
      # push and hands the published digest (output `digest`) to the signref
      # step, so the signing, the attestations and the tag check run against it;
      # anything else is refused, because a published version must never
      # change. Only "not found" lets a first publish continue: any other
      # answer (auth, network) stops the run, so a failed lookup can never turn
      # into an overwrite.
      - name: Refuse to overwrite a published version
        id: exists
        run: |
          set -uo pipefail
          if [ "$KIND" != release ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="$IMAGE_NAME:$VERSION"
          # The step runs as `bash -e {0}`, and `set -uo pipefail` does not turn -e off: a
          # bare `out=$(...)` would end the step on the normal "not found" answer of a first
          # publish, before the rc check below. `|| rc=$?` keeps the failure in rc.
          rc=0
          out="$(docker buildx imagetools inspect "$ref" 2>&1)" || rc=$?
          if [ "$rc" = 0 ]; then
            # A digest is the sha256 of the manifest's exact bytes, which --raw prints.
            # Do not use --format '{{.Manifest.Digest}}': buildx answers any format that
            # starts with {{.Manifest with its full listing, which names the tag.
            published="$(docker buildx imagetools inspect "$ref" --raw | sha256sum)" || published=""
            this_commit="$(docker buildx imagetools inspect "$IMAGE_NAME:sha-$SHA12" --raw 2>/dev/null | sha256sum)" || this_commit=""
            if [ -n "$published" ] && [ "$published" = "$this_commit" ]; then
              # sha256sum prints "<64 hex>  -"; the digest is sha256:<64 hex>
              # (the signref step checks that shape before anything signs it).
              published="${published%% *}"
              echo "::notice::$ref is already published from this commit as sha256:$published; not pushing it again, signing and checking that digest instead"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "digest=sha256:$published" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "$VERSION" in
              *-*) next="raise the -beta.N in composer.json on main, merge, and tag the new version" ;;
              *) next="fix forward with the next patch (raise X.Y.Z in composer.json on release/${VERSION%.*}), merge, and tag the new version" ;;
            esac
            echo "::error::$ref is already published from a different build. A published version is never overwritten: $next instead."
            exit 1
          fi
          case "$out" in
            *": not found"*)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Fail closed: an auth or network error must not look like "absent".
              # A package that has never been pushed also lands here; publish
              # main first (it creates the package), then re-run this tag.
              echo "::error::could not tell whether $ref exists: $out"
              exit 1
              ;;
          esac

      # Builds now and pushes nothing, so the step that pushes finds every layer
      # in the builder's cache and takes seconds. The tag check below would
      # otherwise be as old as the whole build by the time the tags are written.
      - name: Build the image (no push)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          pull: true

      - name: Compute tags and labels
        id: meta
        run: |
          set -euo pipefail
          # scripts/release-channel.sh decides the tag list here, right before
          # the push, not in the version job: beta -> X.Y.Z-beta.N + beta;
          # stable -> X.Y.Z plus X.Y and the latest tag when nothing newer is
          # published on its line / on any line; every run adds sha-<12>.
          # This step pushes nothing, so it also runs when the push is skipped:
          # the list it computes is then the set of tags that must resolve to
          # the already published digest (the check after the signing). A
          # newer stable published since the first attempt drops the latest
          # tag / X.Y from the list, so they are not demanded of the old digest.
          out="$(VERSION_FILE=composer.json bash scripts/release-channel.sh)"
          echo "$out"
          tags="$(printf '%s\n' "$out" | sed -n '/^image_tags<<EOF_IMAGE_TAGS$/,/^EOF_IMAGE_TAGS$/p' | sed '1d;$d')"
          move_latest="$(printf '%s\n' "$out" | sed -n 's/^move_latest=//p')"
          if [ -z "$tags" ]; then
            echo "::error::scripts/release-channel.sh computed no image tags"
            exit 1
          fi
          while IFS= read -r t; do
            case "$t" in
              "$IMAGE_NAME":?*) ;;
              *) echo "::error::unexpected image tag '$t'"; exit 1 ;;
            esac
          done <<< "$tags"
          if [ "$KIND" = release ]; then
            label_version="$VERSION"
          else
            label_version="$GITHUB_REF_NAME"
          fi
          {
            echo "move_latest=$move_latest"
            echo "tags<<EOF_TAGS"
            echo "$tags"
            echo "EOF_TAGS"
            echo "labels<<EOF_LABELS"
            echo "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.version=$label_version"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "EOF_LABELS"
          } >> "$GITHUB_OUTPUT"
          echo "Tags:"
          echo "$tags"

      - name: Build and push image
        id: build
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- signed-images-20261021 ---
      # Everything below signs ONE digest, from this GitHub-hosted job: a cosign
      # keyless signature (Sigstore, GitHub OIDC), a SLSA build-provenance
      # attestation and an SPDX SBOM attestation, both pushed next to the image.
      # Which digest: what the step `build` just pushed, or, when the push was
      # skipped because :X.Y.Z is already published from this commit, that
      # published digest (from the overwrite guard). So "Re-run failed jobs"
      # after a cosign/attest failure signs the image the first attempt left
      # unsigned, instead of skipping the signing and letting github-release
      # vouch for an unsigned digest. Nothing below continues on error: a failed
      # signature fails the job, and a failed image job creates no release.
      # A skipped push that finds a computed tag pointing elsewhere (a beta
      # whose :beta has moved on to a newer beta, or a floating tag the first
      # attempt never got to write) fails the check at the end; that release is
      # not repairable by a re-run and is cut again as the next version instead.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success' || steps.exists.outputs.skip == 'true'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SKIP: ${{ steps.exists.outputs.skip }}
          PUBLISHED_DIGEST: ${{ steps.exists.outputs.digest }}
          EXPECTED_TAGS: ${{ steps.meta.outputs.tags }}
          MOVE_LATEST: ${{ steps.meta.outputs.move_latest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          expected = sorted(t.rpartition(":")[2] for t in os.environ.get("EXPECTED_TAGS", "").split() if t)
          if not expected:
              sys.exit("::error::no computed tags; nothing to sign")
          if os.environ.get("SKIP") == "true":
              # The push was skipped: :X.Y.Z is already published from this commit.
              # Sign and check that digest under the tags computed right now.
              digest = os.environ.get("PUBLISHED_DIGEST", "")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  sys.exit(f"::error::the overwrite guard gave no usable published digest: {digest!r}")
              repo = os.environ.get("IMAGE_NAME", "")
              tags = list(expected)
              what = "re-signing the published"
          else:
              meta = json.loads(os.environ.get("METADATA") or "{}")
              digest = os.environ.get("DIGEST", "")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  sys.exit(f"::error::build step gave no usable digest: {digest!r}")
              names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
              repos, tags = set(), []
              for n in names:
                  head, _, last = n.rpartition("/")
                  if ":" in last:
                      last, tag = last.split(":", 1)
                      tags.append(tag)
                  repos.add(f"{head}/{last}")
              if len(repos) != 1:
                  sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
              if sorted(tags) != expected:
                  sys.exit(f"::error::pushed tags {sorted(tags)} are not the computed tags {expected}")
              repo = repos.pop()
              what = "signing"
          # The latest tag only for a stable version that owns it (MOVE_LATEST from the
          # check right before the push). The "-" fallback makes a missing or EMPTY VERSION fail
          # closed (a job output that was never set arrives as "", not unset).
          if "latest" in tags and ("-" in (os.environ.get("VERSION") or "-") or os.environ.get("MOVE_LATEST") != "true"):
              sys.exit("::error::a tag named latest was pushed; beta images and older-line patches must never be tagged latest")
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"{what} {repo}@{digest} (tags: {', '.join(tags)})")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # cosign and the attestations bind to the digest, so they cover every tag
      # that resolves to it. Prove each computed tag does (a floating tag moved
      # by a concurrent run would not; on a skipped push, a tag the first
      # attempt never wrote would not either).
      - name: Check every pushed tag resolves to the signed digest
        if: steps.signref.outcome == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            # A digest is the sha256 of the manifest's exact bytes, which --raw
            # prints. Do not use --format '{{.Manifest.Digest}}': buildx answers
            # any format that starts with {{.Manifest with its full listing.
            if ! raw_sha="$(docker buildx imagetools inspect "$ref" --raw | sha256sum)"; then
              echo "::error::could not read $ref from the registry"
              exit 1
            fi
            got="sha256:${raw_sha%% *}"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$ref resolves to $got, not the signed digest $DIGEST"
              exit 1
            fi
            echo "$ref -> $DIGEST (signed)"
          done <<< "$TAGS"

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|heads/release/[0-9]+[.][0-9]+|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, image]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This job needs a SUCCESSFUL image job (no always()/!cancelled() here,
      # ever): the release vouches for an image, and the image job only
      # succeeds once every tag resolves to a signed, attested digest.
      #
      # beta -> prerelease, never Latest. stable -> a full release, marked
      # Latest only when nothing newer is published on any line (gh would
      # otherwise pick Latest by date and mislabel an older-line patch). That is
      # decided here, right before the release is created: a newer stable may
      # have published since the image job, or days ago if this is a re-run.
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it alone"
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          case "$VERSION" in
            *-*) args+=(--prerelease --latest=false) ;;
            *)
              out="$(VERSION_FILE=composer.json bash scripts/release-channel.sh)"
              echo "$out"
              move_latest="$(printf '%s\n' "$out" | sed -n 's/^move_latest=//p')"
              if [ "$move_latest" = true ]; then
                args+=(--latest)
              else
                args+=(--latest=false)
              fi
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}"

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
